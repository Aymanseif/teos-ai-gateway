name: Feature request
description: Suggest an improvement to TEOS AI Gateway.
labels:
  - enhancement
body:
  - type: textarea
    id: what
    attributes:
      label: What?
      description: What would you like TEOS AI Gateway to do?
      placeholder: Describe the feature.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: Why would this be useful?
      placeholder: Describe the problem or use case this would address.
    validations:
      required: true
